name: Release

# Push a tag like v0.2.0 to build and publish: Windows portable zip, Linux tar.gz and .deb.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p nex-app
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/nexspeed.exe dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "nexspeed-${{ github.ref_name }}-windows-x86_64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: nexspeed-*-windows-x86_64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev libdbus-1-dev pkg-config \
            libxdo-dev
      - run: cargo build --release -p nex-app
      - run: cargo install cargo-deb --locked
      - run: cargo deb -p nex-app --no-build --output .
      - name: Tarball
        run: |
          mkdir dist
          cp target/release/nexspeed README.md LICENSE dist/
          cp crates/nex-app/assets/icons/nexspeed-256.png dist/nexspeed.png
          cp crates/nex-app/assets/nexspeed.desktop dist/
          tar -C dist -czf nexspeed-${{ github.ref_name }}-linux-x86_64.tar.gz .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            nexspeed-*-linux-x86_64.tar.gz
            nexspeed_*.deb
